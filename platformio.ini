; PlatformIO Project Configuration File
; 26GX_New - 反恐排爆救援机器人 (STM32F103VET6, CubeMX + CMSIS-RTOS2 + FreeRTOS)
;
; 结构约定 (仿照 F_test_VE):
;   Core/          -> CubeMX 生成的应用代码 (main.c, freertos.c, FreeRTOSConfig.h 等)
;   src/           -> 业务代码 (.c 放这)
;   include/       -> 业务头文件 (.h 放这)
;   lib/FreeRTOS/  -> FreeRTOS 内核 + CMSIS-RTOS2 封装 (只留 heap_4 + ARM_CM3 port)
;   HAL/CMSIS      -> 使用 PlatformIO stm32cube 框架内置库, 无需手工搬运

[env:genericSTM32F103VE]
platform = ststm32
board = genericSTM32F103VE
framework = stm32cube

; 同时编译 Core/Src (CubeMX 生成) 和 src/ (业务代码)
; 注意: lib/ 下的 FreeRTOS 内核 .c 由 PlatformIO 自动编译, 无需额外声明
; src/ 按子系统分层 (common/ chassis/ app/), 故必须递归匹配所有子目录
build_src_filter =
    +<../Core/Src/*.c>
    +<**/*.c>

; 头文件搜索路径 (用相对路径, 避开 ${platformio.packages_dir} 展开 bug)
build_flags =
    -ICore/Inc
    -Iinclude
    -Ilib/FreeRTOS/include
    -Ilib/FreeRTOS/CMSIS_RTOS_V2
    -Ilib/FreeRTOS/portable/GCC/ARM_CM3

; 审计 H9：调试编译开关。取消下一行的注释后 IWDG 不启动，
; 断点/单步不会被看门狗复位；发布固件必须保持注释状态。
; build_flags += -DDEBUG_WITHOUT_IWDG

; ST-Link 下载 + 调试配置
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
